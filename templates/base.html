<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Study Sathi{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f13;--surface:#16181f;--card:#1c1e28;--border:#2a2d3a;--accent:#6c63ff;--accent2:#00d4aa;--text:#e8e9f0;--muted:#7b7f96;--danger:#ff5c6a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
a{color:var(--accent);text-decoration:none;}
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;}
.logo{font-family:'Sora',sans-serif;font-weight:700;font-size:1.2rem;color:var(--text);}
.logo span{color:var(--accent);}
.nav-links{display:flex;gap:8px;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;font-size:0.9rem;font-family:'DM Sans',sans-serif;cursor:pointer;border:none;transition:all .2s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#7c75ff;transform:translateY(-1px);}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border);}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);}
.btn-sm{padding:6px 14px;font-size:0.82rem;}
.btn-success{background:var(--accent2);color:#0e0f13;}
.container{max-width:1100px;margin:0 auto;padding:32px 24px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;transition:border-color .2s;}
.card:hover{border-color:var(--accent);}
.flash{padding:12px 18px;border-radius:8px;margin-bottom:20px;font-size:0.9rem;}
.flash.success{background:#00d4aa22;border:1px solid var(--accent2);color:var(--accent2);}
.flash.error{background:#ff5c6a22;border:1px solid var(--danger);color:var(--danger);}
.flash.info{background:#6c63ff22;border:1px solid var(--accent);color:var(--accent);}
input,textarea,select{width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.95rem;outline:none;transition:border-color .2s;}
input:focus,textarea:focus{border-color:var(--accent);}
label{display:block;margin-bottom:6px;font-size:0.88rem;color:var(--muted);}
.form-group{margin-bottom:18px;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.78rem;background:#6c63ff22;color:var(--accent);border:1px solid #6c63ff44;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
@media(max-width:700px){.grid-2,.grid-3{grid-template-columns:1fr;}}
h1,h2,h3{font-family:'Sora',sans-serif;font-weight:700;}
h1{font-size:2rem;}h2{font-size:1.4rem;}h3{font-size:1.1rem;}
.muted{color:var(--muted);font-size:0.88rem;}
.mt{margin-top:24px;}.mb{margin-bottom:24px;}
.flex{display:flex;align-items:center;}.gap{gap:12px;}.jc-sb{justify-content:space-between;}
</style>
</head>
<body>
<nav>
  <span class="logo">Study<span>Sathi</span></span>
<form action="/search" method="GET" style="display:flex;gap:8px;">
  <input name="q" placeholder="Search groups..." style="width:200px;padding:6px 12px;border-radius:8px;">
  <button class="btn btn-outline btn-sm">Search</button>
</form>
  <div class="nav-links">
    {% if session.user_id %}
      <span class="muted">Hi, {{ session.user_name }}</span>
      <a href="{{ url_for('dashboard') }}" class="btn btn-outline btn-sm">Dashboard</a>
      <a href="{{ url_for('logout') }}" class="btn btn-outline btn-sm">Logout</a>
    {% else %}
      <a href="{{ url_for('login') }}" class="btn btn-outline btn-sm">Login</a>
      <a href="{{ url_for('signup') }}" class="btn btn-primary btn-sm">Sign Up</a>
    {% endif %}
  </div>
</nav>
<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
