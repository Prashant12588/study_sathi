{% extends "base.html" %}
{% block title %}Login — Study Sathi{% endblock %}
{% block content %}
<div style="max-width:440px;margin:40px auto;">
  <h2 class="mb">Welcome back</h2>
  <div class="card">
    <form method="POST">
      <div class="form-group"><label>Email</label><input name="email" type="email" required placeholder="you@email.com"></div>
      <div class="form-group"><label>Password</label><input name="password" type="password" required placeholder="your password"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;">Login</button>
    </form>
    <p class="muted mt" style="text-align:center;">No account? <a href="{{ url_for('signup') }}">Sign up free</a></p>
  </div>
</div>
{% endblock %}
