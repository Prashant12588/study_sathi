{% extends "base.html" %}
{% block title %}Create Group — Study Sathi{% endblock %}
{% block content %}
<div style="max-width:540px;margin:40px auto;">
  <h2 class="mb">Create a study group</h2>
  <div class="card">
    <form method="POST">
      <div class="form-group"><label>Group Name</label><input name="name" required placeholder="e.g. DSA Warriors"></div>
      <div class="form-group"><label>Subject</label><input name="subject" required placeholder="e.g. Data Structures, Cloud Computing"></div>
      <div class="form-group"><label>Description</label><textarea name="description" rows="3" placeholder="What will this group study?"></textarea></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;">Create Group</button>
    </form>
  </div>
</div>
{% endblock %}
