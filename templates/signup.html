{% extends "base.html" %}
{% block title %}Sign Up — Study Sathi{% endblock %}
{% block content %}
<div style="max-width:440px;margin:40px auto;">
  <h2 class="mb">Create your account</h2>
  <div class="card">
    <form method="POST">
      <div class="form-group"><label>Full Name</label><input name="name" required placeholder="Prashant Yadav"></div>
      <div class="form-group"><label>Email</label><input name="email" type="email" required placeholder="you@email.com"></div>
      <div class="form-group"><label>Password</label><input name="password" type="password" required placeholder="min 6 characters"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;">Create Account</button>
    </form>
    <p class="muted mt" style="text-align:center;">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
